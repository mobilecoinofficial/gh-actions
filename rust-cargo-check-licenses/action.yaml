name: Check Rust Licenses
description: Check Rust licenses and source bans

runs:
  using: composite
  steps:
  - name: Checkout
    uses: mobilecoinofficial/gh-actions/checkout@v0
    with:
      submodules: 'false'
  - name: Advisories
    id: advisories
    continue-on-error: true
    uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
    with:
      command: check advisories
  - name: License and Source Bans
    uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
    with:
      command: check bans licenses sources
  - name: Report Advisories Failure Status
    if: steps.advisories.outcome == 'failure'
    shell: bash
    run: |
      echo "::error title=Cargo Advisories Failed:: Check Advisories job output for details."


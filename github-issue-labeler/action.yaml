name: Github Issue Labeler
description: wrap github/issue-labeler to label issues and pull requests based on their content

inputs:
  github-token:
    description: GitHub token to use for authentication
    required: true
  configuration-path:
    description: Path to the configuration file for the labeler
    default: .github/triage-labeler.yaml
  enable-versioned-regex:
    description: Enable versioned regex support (0 or 1)
    default: '0'

runs:
  using: composite
  steps:
  - uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.5
    with:
      repo-token: "${{ inputs.github-token }}"
      configuration-path: "${{ inputs.configuration-path }}"
      enable-versioned-regex: "${{ inputs.enable-versioned-regex }}"
